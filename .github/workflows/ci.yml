name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read   # @chanho4702/* (GitHub Packages) 읽기

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11   # package.json에 packageManager 필드 없음 — 명시 필요
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com   # 러너 홈의 .npmrc에 NODE_AUTH_TOKEN 인증을 써 준다
          scope: '@chanho4702'

      # 디자인시스템은 GitHub Packages(@chanho4702/*, 공개 패키지)에서 받는다 — 예전처럼 design-system을
      # 체크아웃해 tgz를 다시 만들지 않는다(S-03, wiki-front와 같은 방식). 공개 패키지라 GITHUB_TOKEN으로 읽힌다.
      # 게이트는 로컬 규칙과 같다: typecheck → test → build (vite build는 타입 오류를 잡지 않는다)
      - name: Typecheck, test & build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      # 프로덕션 번들에 목업(localStorage 키·시드)이 실리지 않았는지 — 파사드는 빌드 시점에 REST만 묶는다(A-12)
      - name: No mock store in bundle
        run: |
          if grep -l 'alm.jira.v1' dist/assets/*.js; then
            echo "::error::목업 스토어(jiraMock)가 프로덕션 번들에 들어갔습니다"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Dispatch deploy
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: chanho4702/infra-settings
          event-type: deploy
          client-payload: '{"service":"alm","sha":"${{ github.sha }}","run_id":"${{ github.run_id }}","repo":"${{ github.repository }}"}'
